name: Publier la release
on:
  push:
    branches: [main]
    paths: [".github/workflows/release.yml"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Créer la release v1.0.0 avec le DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp Merlin-Backup-Cloner-1.0.0.dmg Merlin-Backup-Cloner.dmg
          gh release create v1.0.0 Merlin-Backup-Cloner.dmg \
            --title "Merlin Backup Cloner 1.0.0" \
            --notes "Première version de Merlin Backup Cloner pour Mac (macOS 13 Ventura ou plus récent, Intel et puce Apple).

          **Installation** : téléchargez Merlin-Backup-Cloner.dmg, ouvrez-le et glissez l'app dans Applications. Au premier lancement : Réglages Système › Confidentialité et sécurité › **Ouvrir quand même**.

          Version de test : essayez-la d'abord sur un disque sans importance."
