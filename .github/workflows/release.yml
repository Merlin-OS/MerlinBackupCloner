name: Publier la release
on:
  push:
    branches: [main]
    paths: [".github/workflows/release.yml"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Créer la release v1.0.1 avec le DMG et son empreinte
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUM=$(sha256sum Merlin-Backup-Cloner.dmg | cut -d' ' -f1)
          cat > notes.md <<NOTES
          ## Nouveautés
          - **Mise à jour automatique** : Merlin prévient quand une nouvelle version sort et l'installe en un clic, sans repasser par GitHub.
          - **Suppression des sauvegardes** : supprimez une version, toutes les versions ou le filet de sécurité, avec confirmation (Corbeille ou définitif).
          - **NTFS** : utilisable comme source ; comme destination avec un pilote tiers (Paragon, Tuxera).
          - « Clonage de fichiers » devient « Copie de fichiers ».

          ## Installation
          Téléchargez Merlin-Backup-Cloner.dmg, ouvrez-le et glissez l'app dans Applications (en remplaçant l'ancienne). Au premier lancement : Réglages Système › Confidentialité et sécurité › **Ouvrir quand même**.

          À partir de cette version, les mises à jour suivantes s'installent directement depuis l'application.

          SHA-256 : \`$SUM\`
          NOTES
          gh release create v1.0.1 Merlin-Backup-Cloner.dmg --title "Merlin Backup Cloner 1.0.1" --notes-file notes.md --latest
